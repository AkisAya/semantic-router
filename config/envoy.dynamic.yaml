static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8801
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  time: "%START_TIME%"
                  protocol: "%PROTOCOL%"
                  request_method: "%REQ(:METHOD)%"
                  request_path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                  response_code: "%RESPONSE_CODE%"
                  response_flags: "%RESPONSE_FLAGS%"
                  bytes_received: "%BYTES_RECEIVED%"
                  bytes_sent: "%BYTES_SENT%"
                  duration: "%DURATION%"
                  upstream_host: "%UPSTREAM_HOST%"
                  upstream_cluster: "%UPSTREAM_CLUSTER%"
                  upstream_local_address: "%UPSTREAM_LOCAL_ADDRESS%"
                  request_id: "%REQ(X-REQUEST-ID)%"
                  selected_model: "%REQ(X-SELECTED-MODEL)%"
                  selected_endpoint: "%REQ(X-GATEWAY-DESTINATION-ENDPOINT)%"
                  authority_header: "%REQ(:AUTHORITY)%"
                  host_header: "%REQ(HOST)%"
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              # 优先匹配 /health，直接返回 200，不转发后端
              - match:
                  path: "/health"
                direct_response:
                  status: 200
                  body:
                    inline_string: "healthy\n"
              # Single route using original destination cluster
              - match:
                  prefix: "/"
                route:
                  cluster: dynamic_forward_proxy_cluster
                  timeout: 300s
                  # dynamic forward proxy 根据 :authority 解析，因此需要确保 ext_proc 把 x-gateway-destination-endpoint 写入 :authority
                  # 如果还希望保留原 Host，可在 ext_proc 中复制到 X-Original-Host
          http_filters:
          # 1. ext_proc 负责设置 x-gateway-destination-endpoint
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc:
                  cluster_name: extproc_service
              allow_mode_override: true
              processing_mode:
                request_header_mode: "SEND"
                response_header_mode: "SEND"
                request_body_mode: "BUFFERED"
                response_body_mode: "BUFFERED"
                request_trailer_mode: "SKIP"
                response_trailer_mode: "SKIP"
              failure_mode_allow: true
              message_timeout: 300s
          # 2. Lua 脚本将 x-gateway-destination-endpoint 复制到 :authority
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  function envoy_on_request(request_handle)
                    local semantic_endpoint = request_handle:headers():get("x-gateway-destination-endpoint")
                    if semantic_endpoint then
                      -- 保存原始 Host 到自定义头部
                      local original_authority = request_handle:headers():get(":authority")
                      if original_authority then
                        request_handle:headers():add("x-original-host", original_authority)
                      end
                      
                      -- 直接将完整的 endpoint 设置为 :authority
                      -- dynamic forward proxy 会解析这个值并提取主机和端口
                      request_handle:headers():replace(":authority", semantic_endpoint)
                      request_handle:headers():replace("host", semantic_endpoint)
                      
                      -- 添加调试信息
                      request_handle:logInfo("Setting :authority to: " .. semantic_endpoint)
                    end
                  end
          # 3. dynamic forward proxy（必须在 :authority 改写之后，router 之前）
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config:
                name: dynamic_dns_cache
                dns_lookup_family: V4_PREFERRED
                host_ttl: 300s
                dns_refresh_rate: 30s
                dns_failure_refresh_rate:
                  base_interval: 2s
                  max_interval: 10s
                max_hosts: 1024
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              suppress_envoy_headers: true
          http2_protocol_options:
            max_concurrent_streams: 100
            initial_stream_window_size: 65536
            initial_connection_window_size: 1048576
          stream_idle_timeout: "300s"
          request_timeout: "300s"
          common_http_protocol_options:
            idle_timeout: "300s"

  clusters:
  - name: extproc_service
    connect_timeout: 300s
    per_connection_buffer_limit_bytes: 52428800
    type: STATIC
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            connection_keepalive:
              interval: 300s
              timeout: 300s
    load_assignment:
      cluster_name: extproc_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 50051

  # dynamic forward proxy cluster (与 http filter 配合)
  - name: dynamic_forward_proxy_cluster
    connect_timeout: 300s
    per_connection_buffer_limit_bytes: 52428800
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config:
          name: dynamic_dns_cache
          dns_lookup_family: V4_PREFERRED
          host_ttl: 300s
          dns_refresh_rate: 30s
          dns_failure_refresh_rate:
            base_interval: 2s
            max_interval: 10s
          max_hosts: 1024
        # 允许不安全的集群选项，因为我们可能连接到 HTTP 服务
        allow_insecure_cluster_options: true
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http_protocol_options: {}

admin:
  address:
    socket_address:
      address: "127.0.0.1"
      port_value: 19000
